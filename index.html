    const DEFAULT_TABLES = [

      { id: 'T12', number: 12, type: 'round', seats: 6, x: 570, y: 410, r: 56, zone: 'vip', status: 'available' },
      { id: 'T13', number: 13, type: 'high_top', seats: 2, x: 740, y: 110, r: 32, zone: 'terrace', status: 'available' },
      { id: 'T14', number: 14, type: 'high_top', seats: 2, x: 740, y: 215, r: 32, zone: 'terrace', status: 'available' },
      { id: 'T15', number: 15, type: 'high_top', seats: 2, x: 740, y: 320, r: 32, zone: 'terrace', status: 'available' },
      { id: 'T16', number: 16, type: 'high_top', seats: 4, x: 740, y: 430, r: 42, zone: 'terrace', status: 'occupied' }
    ];

    const DEFAULT_BOOKINGS = [
      { id: 'B-101', clientName: 'Ardit Krasniqi', phone: '+355 69 221 4455', partySize: 4, time: '18:30', tableNumber: 3, zone: 'main', status: 'confirmed', notes: 'VIP Guest / Table by window' },
      { id: 'B-102', clientName: 'Elena Rostova', phone: '+1 917 555 0142', partySize: 6, time: '19:00', tableNumber: 5, zone: 'booths', status: 'seated', notes: 'Anniversary celebration' },
      { id: 'B-103', clientName: 'Blerim Hoxha', phone: '+383 44 123 789', partySize: 4, time: '19:30', tableNumber: 10, zone: 'main', status: 'confirmed', notes: 'Gluten allergy' },
      { id: 'B-104', clientName: 'Gjon Bardhi', phone: '+355 68 887 6543', partySize: 4, time: '20:00', tableNumber: 16, zone: 'terrace', status: 'seated', notes: 'Cocktails and dessert' }
    ];

    const DEFAULT_WAITLIST = [
      { id: 'W-01', clientName: 'Mirlind Daku', partySize: 2, phone: '+383 49 555 999', waitMinutes: 14, notes: 'Prefers Terrace or High-top' },
      { id: 'W-02', clientName: 'Sarah Jenkins', partySize: 4, phone: '+1 212 555 0876', waitMinutes: 8, notes: 'Booth if possible' }
    ];

    const SLOTS = ['17:00', '17:30', '18:00', '18:30', '19:00', '19:30', '20:00', '20:30', '21:00', '21:30'];

    function App() {
      const [lang, setLang] = useState(() => localStorage.getItem('tavolina_lang') || 'sq');
      const [activeTab, setActiveTab] = useState('floor');
      const [tables, setTables] = useState(() => {
        const saved = localStorage.getItem('tavolina_tables_v3');
        return saved ? JSON.parse(saved) : DEFAULT_TABLES;
      });
      const [bookings, setBookings] = useState(() => {
        const saved = localStorage.getItem('tavolina_bookings_v3');
        return saved ? JSON.parse(saved) : DEFAULT_BOOKINGS;
      });
      const [waitlist, setWaitlist] = useState(() => {
        const saved = localStorage.getItem('tavolina_waitlist_v3');
        return saved ? JSON.parse(saved) : DEFAULT_WAITLIST;
      });

      // Filters
      const [selectedZone, setSelectedZone] = useState('all');
      const [selectedTime, setSelectedTime] = useState('19:30');
      const [guestFilter, setGuestFilter] = useState(2);
      const [selectedDate, setSelectedDate] = useState('2026-10-04');

      // Booking Modal (Create & Edit)
      const [isBookingModalOpen, setIsBookingModalOpen] = useState(false);
      const [bookingModalMode, setBookingModalMode] = useState('create'); // 'create' | 'edit'
      const [currentBookingId, setCurrentBookingId] = useState(null);
      const [formData, setFormData] = useState({
        clientName: '',
        phone: '',
        partySize: 2,
        time: '19:30',
        tableNumber: 1,
        notes: '',
        status: 'confirmed'
      });
      const [actionMessage, setActionMessage] = useState(null);

      // Waitlist Modal
      const [isWaitlistModalOpen, setIsWaitlistModalOpen] = useState(false);

      // Table Editor Selected
      const [editingTableId, setEditingTableId] = useState(tables[0]?.id || 'T1');

      const t = DICTIONARY[lang];

      useEffect(() => {
        localStorage.setItem('tavolina_lang', lang);
      }, [lang]);

      useEffect(() => {
        localStorage.setItem('tavolina_tables_v3', JSON.stringify(tables));
      }, [tables]);

      useEffect(() => {
        localStorage.setItem('tavolina_bookings_v3', JSON.stringify(bookings));
      }, [bookings]);

      useEffect(() => {
        localStorage.setItem('tavolina_waitlist_v3', JSON.stringify(waitlist));
      }, [waitlist]);

      const filteredTables = useMemo(() => {
        if (selectedZone === 'all') return tables;
        return tables.filter(tItem => tItem.zone === selectedZone);
      }, [tables, selectedZone]);

      const editingTable = useMemo(() => {
        return tables.find(tItem => tItem.id === editingTableId) || tables[0];
      }, [tables, editingTableId]);

      // Open modal to create booking for a specific table clicked on map
      const handleTableClick = (tbl) => {
        if (activeTab === 'editor') {
          setEditingTableId(tbl.id);
          return;
        }
        if (tbl.status === 'occupied') {
          // Find existing booking to view/edit
          const match = bookings.find(b => b.tableNumber === tbl.number);
          if (match) {
            handleOpenEditBooking(match);
            return;
          }
        }
        if (tbl.status === 'reserved') {
          const match = bookings.find(b => b.tableNumber === tbl.number);
          if (match) {
            handleOpenEditBooking(match);
            return;
          }
        }

        setBookingModalMode('create');
        setCurrentBookingId(null);
        setFormData({
          clientName: '',
          phone: '',
          partySize: tbl.seats,
          time: selectedTime,
          tableNumber: tbl.number,
          notes: '',
          status: 'confirmed'
        });
        setIsBookingModalOpen(true);
      };

      // Open modal to create a general booking
      const handleOpenCreateBooking = () => {
        const firstAvail = tables.find(t => t.status === 'available') || tables[0];
        setBookingModalMode('create');
        setCurrentBookingId(null);
        setFormData({
          clientName: '',
          phone: '',
          partySize: 2,
          time: selectedTime,
          tableNumber: firstAvail.number,
          notes: '',
          status: 'confirmed'
        });
        setIsBookingModalOpen(true);
      };

      // Open modal to modify booking
      const handleOpenEditBooking = (booking) => {
        setBookingModalMode('edit');
        setCurrentBookingId(booking.id);
        setFormData({
          clientName: booking.clientName,
          phone: booking.phone,
          partySize: booking.partySize,
          time: booking.time,
          tableNumber: booking.tableNumber,
          notes: booking.notes || '',
          status: booking.status || 'confirmed'
        });
        setIsBookingModalOpen(true);
      };

      // Save (Create or Modify)
      const handleSaveBooking = (e) => {
        e.preventDefault();
        const targetTable = tables.find(t => t.number === Number(formData.tableNumber));
        const zone = targetTable ? targetTable.zone : 'main';

        if (bookingModalMode === 'create') {
          const newBooking = {
            id: `B-${Date.now().toString().slice(-4)}`,
            clientName: formData.clientName,
            phone: formData.phone,
            partySize: Number(formData.partySize),
            time: formData.time,
            tableNumber: Number(formData.tableNumber),
            zone: zone,
            status: formData.status,
            notes: formData.notes
          };
          setBookings(prev => [newBooking, ...prev]);

          // Update table status
          setTables(prev => prev.map(tItem => 
            tItem.number === Number(formData.tableNumber)
              ? { ...tItem, status: formData.status === 'seated' ? 'occupied' : 'reserved' }
              : tItem
          ));
          showToast(lang === 'sq' ? 'Rezervimi u shtua me sukses!' : 'Reservation created successfully!');
        } else {
          // Editing existing booking
          const oldBooking = bookings.find(b => b.id === currentBookingId);

          setBookings(prev => prev.map(b => 
            b.id === currentBookingId
              ? {
                  ...b,
                  clientName: formData.clientName,
                  phone: formData.phone,
                  partySize: Number(formData.partySize),
                  time: formData.time,
                  tableNumber: Number(formData.tableNumber),
                  zone: zone,
                  status: formData.status,
                  notes: formData.notes
                }
              : b
          ));

          // If table changed, free the old table
          if (oldBooking && oldBooking.tableNumber !== Number(formData.tableNumber)) {
            setTables(prev => prev.map(tItem => {
              if (tItem.number === oldBooking.tableNumber) return { ...tItem, status: 'available' };
              if (tItem.number === Number(formData.tableNumber)) return { ...tItem, status: formData.status === 'seated' ? 'occupied' : 'reserved' };
              return tItem;
            }));
          } else {
            // update existing table's status
            setTables(prev => prev.map(tItem => 
              tItem.number === Number(formData.tableNumber)
                ? { ...tItem, status: formData.status === 'seated' ? 'occupied' : 'reserved' }
                : tItem
            ));
          }
          showToast(lang === 'sq' ? 'Rezervimi u modifikua me sukses!' : 'Reservation updated successfully!');
        }

        setIsBookingModalOpen(false);
      };

      // Cancel / Delete Reservation
      const handleCancelBooking = (bookingId) => {
        const toCancel = bookings.find(b => b.id === bookingId);
        if (!toCancel) return;

        const confirmMsg = lang === 'sq' 
          ? `A jeni i sigurt që dëshironi të anuloni rezervimin për ${toCancel.clientName} (Tavolina #${toCancel.tableNumber})?`
          : `Are you sure you want to cancel the reservation for ${toCancel.clientName} (Table #${toCancel.tableNumber})?`;

        if (!confirm(confirmMsg)) return;

        // Free up the table
        setTables(prev => prev.map(tItem => 
          tItem.number === toCancel.tableNumber ? { ...tItem, status: 'available' } : tItem
        ));

        // Remove from bookings
        setBookings(prev => prev.filter(b => b.id !== bookingId));
        if (isBookingModalOpen && currentBookingId === bookingId) {
          setIsBookingModalOpen(false);
        }
        showToast(lang === 'sq' ? 'Rezervimi u anulua dhe tavolina u lirua!' : 'Booking cancelled and table freed!');
      };

      const showToast = (msg) => {
        setActionMessage(msg);
        setTimeout(() => setActionMessage(null), 3000);
      };

      // Seat from waitlist
      const seatWaitlistGuest = (waitItem) => {
        const candidate = tables.find(tItem => tItem.status === 'available' && tItem.seats >= waitItem.partySize);
        if (!candidate) {
          alert(lang === 'sq' ? 'Nuk ka asnjë tavolinë të lirë me kapacitet të mjaftueshëm tani!' : 'No available table matches this party size right now.');
          return;
        }

        setTables(prev => prev.map(tItem => 
          tItem.id === candidate.id ? { ...tItem, status: 'occupied' } : tItem
        ));
        setWaitlist(prev => prev.filter(w => w.id !== waitItem.id));
        setBookings(prev => [{
          id: `B-${Date.now().toString().slice(-4)}`,
          clientName: waitItem.clientName,
          phone: waitItem.phone,
          partySize: waitItem.partySize,
          time: selectedTime,
          tableNumber: candidate.number,
          zone: candidate.zone,
          status: 'seated',
          notes: `Walk-in from waitlist. ${waitItem.notes || ''}`
        }, ...prev]);

        showToast(lang === 'sq' ? `${waitItem.clientName} u ul në Tavolinën #${candidate.number}!` : `${waitItem.clientName} seated at Table #${candidate.number}!`);
      };

      // Add to waitlist
      const handleAddWaitlist = (e) => {
        e.preventDefault();
        const form = e.target;
        const newWait = {
          id: `W-${Date.now().toString().slice(-4)}`,
          clientName: form.clientName.value,
          partySize: Number(form.partySize.value),
          phone: form.phone.value,
          waitMinutes: 0,
          notes: form.notes.value
        };
        setWaitlist(prev => [...prev, newWait]);
        setIsWaitlistModalOpen(false);
        form.reset();
        showToast(lang === 'sq' ? 'Klienti u shtua në pritje!' : 'Guest added to waitlist!');
      };

      // Editor table alterations
      const updateEditingTable = (field, val) => {
        setTables(prev => prev.map(tbl => 
          tbl.id === editingTableId ? { ...tbl, [field]: val } : tbl
        ));
      };

      const handleCreateNewTable = () => {
        const nextNum = Math.max(...tables.map(tItem => tItem.number), 0) + 1;
        const newT = {
          id: `T${nextNum}`,
          number: nextNum,
          type: 'round',
          seats: 4,
          x: 420,
          y: 270,
          r: 45,
          zone: 'main',
          status: 'available'
        };
        setTables(prev => [...prev, newT]);
        setEditingTableId(newT.id);
      };

      const handleDeleteTable = (id) => {
        if (tables.length <= 1) return;
        const updated = tables.filter(tItem => tItem.id !== id);
        setTables(updated);
        setEditingTableId(updated[0].id);
      };

      // Analytics
      const analyticsData = useMemo(() => {
        const totalTables = tables.length;
        const occupiedCount = tables.filter(tItem => tItem.status === 'occupied').length;
        const reservedCount = tables.filter(tItem => tItem.status === 'reserved').length;
        const seatedCovers = tables.filter(tItem => tItem.status === 'occupied').reduce((acc, curr) => acc + curr.seats, 0);
        const bookedCovers = bookings.reduce((acc, curr) => acc + curr.partySize, 0);
        const occupancyPct = Math.round(((occupiedCount + reservedCount) / totalTables) * 100) || 0;
        const estRevenue = (seatedCovers + bookedCovers) * 48;

        return {
          totalTables,
          occupiedCount,
          reservedCount,
          seatedCovers,
          bookedCovers,
          occupancyPct,
          estRevenue
        };
      }, [tables, bookings]);

      const exportCSV = () => {
        const headers = "ID,Klienti,Telefoni,Persona,Ora,Tavolina,Zona,Statusi\n";
        const rows = bookings.map(b => 
          `"${b.id}","${b.clientName}","${b.phone}",${b.partySize},"${b.time}",${b.tableNumber},"${b.zone}","${b.status}"`
        ).join("\n");
        const blob = new Blob([headers + rows], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `Tavolina_Raport_${selectedDate}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="flex flex-col h-full w-full bg-[#090d16] select-none relative">

                        >
                          <option value="main">{t.zones.main}</option>
                          <option value="booths">{t.zones.booths}</option>
                          <option value="vip">{t.zones.vip}</option>
                          <option value="terrace">{t.zones.terrace}</option>
                        </select>
                      </div>

                      <div className="grid grid-cols-2 gap-3 pt-1">
                        <div>
                          <label className="text-slate-300 font-semibold block mb-1">{t.editor.posX}</label>
                          <input
                            type="number"
                            value={editingTable.x}
                            onChange={(e) => updateEditingTable('x', Number(e.target.value))}
                            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white"
                          />
                        </div>
                        <div>
                          <label className="text-slate-300 font-semibold block mb-1">{t.editor.posY}</label>
                          <input
                            type="number"
                            value={editingTable.y}
                            onChange={(e) => updateEditingTable('y', Number(e.target.value))}
                            className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="text-slate-300 font-semibold block mb-1">{t.editor.status}</label>
                        <select
                          value={editingTable.status}
                          onChange={(e) => updateEditingTable('status', e.target.value)}
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-white"
                        >
                          <option value="available">{t.statuses.available}</option>
                          <option value="reserved">{t.statuses.reserved}</option>
                          <option value="occupied">{t.statuses.occupied}</option>
                        </select>
                      </div>
                    </div>
                  </div>

                  <div className="pt-4 border-t border-slate-800 flex items-center justify-between">
                    <button
                      onClick={() => handleDeleteTable(editingTable.id)}
                      className="px-3 py-2 bg-rose-900/50 hover:bg-rose-800 text-rose-300 border border-rose-700/50 rounded-lg text-xs font-semibold"
                    >
                      {t.actions.delete}
                    </button>
                    <span className="text-[11px] text-emerald-400 font-medium">✓ Auto-saved in storage</span>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 5: ANALYTICS & REPORTS */}
            {activeTab === 'analytics' && (
              <div className="w-full h-full max-h-[84vh] overflow-y-auto custom-scroll space-y-5 p-1">
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="bg-[#0f172a] border border-slate-800 rounded-xl p-4 shadow">
                    <span className="text-[11px] text-slate-400 block">{t.analytics.totalCovers}</span>
                    <span className="text-2xl font-black text-white mt-1 block">
                      {analyticsData.seatedCovers + analyticsData.bookedCovers}
                    </span>
                    <span className="text-[10px] text-emerald-400">↑ 18% vs djes</span>
                  </div>

                  <div className="bg-[#0f172a] border border-slate-800 rounded-xl p-4 shadow">
                    <span className="text-[11px] text-slate-400 block">{t.analytics.occupancyRate}</span>
                    <span className="text-2xl font-black text-amber-400 mt-1 block">
                      {analyticsData.occupancyPct}%
                    </span>
                    <span className="text-[10px] text-slate-400">{analyticsData.occupiedCount + analyticsData.reservedCount} / {analyticsData.totalTables} tavolina</span>
                  </div>

                  <div className="bg-[#0f172a] border border-slate-800 rounded-xl p-4 shadow">
                    <span className="text-[11px] text-slate-400 block">{t.analytics.avgTurnTime}</span>
                    <span className="text-2xl font-black text-rose-400 mt-1 block">84 min</span>
                    <span className="text-[10px] text-slate-400">Turnover mesatar</span>
                  </div>

                  <div className="bg-[#0f172a] border border-slate-800 rounded-xl p-4 shadow">
                    <span className="text-[11px] text-slate-400 block">{t.analytics.projectedRevenue}</span>
                    <span className="text-2xl font-black text-emerald-400 mt-1 block">
                      ${analyticsData.estRevenue.toLocaleString()}
                    </span>
                    <span className="text-[10px] text-slate-400">Mesatare $48 / cover</span>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="bg-[#0f172a] border border-slate-800 rounded-xl p-5 shadow">
                    <h3 className="text-xs font-bold text-white uppercase tracking-wider mb-4">
                      {t.analytics.trafficPerHour}
                    </h3>
                    <div className="space-y-2">
                      {[
                        { hour: '17:00', load: 30 },
                        { hour: '18:00', load: 55 },
                        { hour: '19:00', load: 92 },
                        { hour: '20:00', load: 85 },
                        { hour: '21:00', load: 45 }
                      ].map(bar => (
                        <div key={bar.hour} className="flex items-center gap-3 text-xs">
                          <span className="w-12 text-slate-400 font-mono">{bar.hour}</span>
                          <div className="flex-1 h-3 bg-slate-800 rounded-full overflow-hidden">
                            <div
                              className="h-full bg-gradient-to-r from-amber-500 to-rose-600 rounded-full"
                              style={{ width: `${bar.load}%` }}
                            ></div>
                          </div>
                          <span className="w-8 text-right text-slate-300 font-bold">{bar.load}%</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="bg-[#0f172a] border border-slate-800 rounded-xl p-5 shadow flex flex-col justify-between">
                    <div>
                      <h3 className="text-xs font-bold text-white uppercase tracking-wider mb-3">
                        {t.analytics.zoneDistribution}
                      </h3>
                      <div className="space-y-2 text-xs">
                        {['main', 'booths', 'vip', 'terrace'].map(zKey => {
                          const count = tables.filter(tbl => tbl.zone === zKey).length;
                          const capacity = tables.filter(tbl => tbl.zone === zKey).reduce((a, c) => a + c.seats, 0);
                          return (
                            <div key={zKey} className="flex items-center justify-between p-2 rounded bg-slate-900/60 border border-slate-800/80">
                              <span className="font-semibold text-slate-200">{t.zones[zKey]}</span>
                              <span className="text-slate-400">{count} Tavolina • <strong className="text-amber-400">{capacity} Vende</strong></span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                    <button
                      onClick={exportCSV}
                      className="mt-4 w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-lg border border-slate-700"
                    >
                      {t.actions.exportCSV}
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* DUAL PURPOSE RESERVATION MODAL (CREATE OR MODIFY) */}
          {isBookingModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0f172a] border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                  <div>
                    <h3 className="text-sm font-bold text-white">
                      {bookingModalMode === 'edit' ? t.bookings.editModalTitle : t.bookings.newModalTitle}
                    </h3>
                    <p className="text-xs text-slate-400">
                      {bookingModalMode === 'edit' ? `ID: ${currentBookingId}` : 'Rezervo shpejt dhe cakto tavolinën'}
                    </p>
                  </div>
                  <button
                    onClick={() => setIsBookingModalOpen(false)}
                    className="text-slate-400 hover:text-white text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleSaveBooking} className="space-y-3">
                  <div>
                    <label className="text-[11px] font-semibold text-slate-300 block mb-1">
                      {t.form.clientName}
                    </label>
                    <input
                      type="text"
                      required
                      value={formData.clientName}
                      onChange={(e) => setFormData({ ...formData, clientName: e.target.value })}
                      placeholder={t.form.clientPlaceholder}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-rose-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-[11px] font-semibold text-slate-300 block mb-1">
                        {t.form.phone}
                      </label>
                      <input
                        type="tel"
                        required
                        value={formData.phone}
                        onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                        placeholder={t.form.phonePlaceholder}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-rose-500"
                      />
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-slate-300 block mb-1">
                        {t.form.partySize}
                      </label>
                      <input
                        type="number"
                        min="1"
                        max="20"
                        value={formData.partySize}
                        onChange={(e) => setFormData({ ...formData, partySize: Number(e.target.value) })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-rose-500"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-[11px] font-semibold text-slate-300 block mb-1">
                        {t.form.time}
                      </label>
                      <select
                        value={formData.time}
                        onChange={(e) => setFormData({ ...formData, time: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-xs text-white focus:outline-none focus:border-rose-500"
                      >
                        {SLOTS.map(st => (
                          <option key={st} value={st}>{st}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="text-[11px] font-semibold text-slate-300 block mb-1">
                        {t.form.tableSelect}
                      </label>
                      <select
                        value={formData.tableNumber}
                        onChange={(e) => setFormData({ ...formData, tableNumber: Number(e.target.value) })}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-xs text-white focus:outline-none focus:border-rose-500"
                      >
                        {tables.map(tbl => (
                          <option key={tbl.id} value={tbl.number}>
                            #{tbl.number} ({tbl.seats}P) - {t.zones[tbl.zone]}
                          </option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="text-[11px] font-semibold text-slate-300 block mb-1">
                      Statusi i Mysafirit
                    </label>
                    <select
                      value={formData.status}
                      onChange={(e) => setFormData({ ...formData, status: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-xs text-white focus:outline-none focus:border-rose-500"
                    >
                      <option value="confirmed">Confirmed (Rezervuar)</option>
                      <option value="seated">Seated (Tashmë të Ulur)</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-[11px] font-semibold text-slate-300 block mb-1">
                      {t.form.notes}
                    </label>
                    <textarea
                      rows="2"
                      value={formData.notes}
                      onChange={(e) => setFormData({ ...formData, notes: e.target.value })}
                      placeholder={t.form.notesPlaceholder}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-rose-500 resize-none"
                    ></textarea>
                  </div>

                  <div className="pt-2 flex items-center gap-2">
                    {bookingModalMode === 'edit' && (
                      <button
                        type="button"
                        onClick={() => handleCancelBooking(currentBookingId)}
                        className="px-3 py-2 rounded-lg bg-rose-950/70 border border-rose-800 text-rose-300 font-semibold text-xs hover:bg-rose-900"
                      >
                        {t.actions.cancelReservation}
                      </button>
                    )}
                    <button
                      type="button"
                      onClick={() => setIsBookingModalOpen(false)}
                      className="flex-1 py-2 rounded-lg bg-slate-800 text-slate-300 font-semibold text-xs hover:bg-slate-700"
                    >
                      {t.actions.close}
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2 rounded-lg bg-gradient-to-r from-rose-600 to-amber-600 text-white font-bold text-xs shadow-lg shadow-rose-600/30 hover:opacity-95"
                    >
                      {bookingModalMode === 'edit' ? t.actions.save : t.actions.confirm}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* WAITLIST ADD MODAL */}
          {isWaitlistModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0f172a] border border-slate-700 rounded-2xl w-full max-w-sm p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                  <h3 className="text-sm font-bold text-white">{t.actions.addToWaitlist}</h3>
                  <button onClick={() => setIsWaitlistModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleAddWaitlist} className="space-y-3">
                  <div>
                    <label className="text-[11px] font-semibold text-slate-300 block mb-1">{t.waitlist.guestName}</label>
                    <input name="clientName" required placeholder="p.sh. Fisnik Gashi" className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-[11px] font-semibold text-slate-300 block mb-1">{t.waitlist.phone}</label>
                      <input name="phone" required placeholder="+355..." className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
                    </div>
                    <div>
                      <label className="text-[11px] font-semibold text-slate-300 block mb-1">{t.waitlist.partySize}</label>
                      <input name="partySize" type="number" min="1" defaultValue="2" className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
                    </div>
                  </div>
                  <div>
                    <label className="text-[11px] font-semibold text-slate-300 block mb-1">{t.waitlist.notes}</label>
                    <input name="notes" placeholder="Preferencë karrigesh, afër dritares..." className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" />
                  </div>
                  <div className="pt-2 flex gap-2">
                    <button type="button" onClick={() => setIsWaitlistModalOpen(false)} className="w-1/2 py-2 bg-slate-800 text-slate-300 rounded-lg text-xs font-semibold">
                      {t.actions.close}
                    </button>
                    <button type="submit" className="w-1/2 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-xs">
                      {t.actions.addToWaitlist}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
