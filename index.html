<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tavolina - Reservation System</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="h-screen flex flex-col bg-[#090d16]">
  <div id="root" class="h-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const DICTIONARY = {
      sq: {
        appTitle: 'TAVOLINA',
        appSubtitle: 'Menaxhimi i Tavolinave & Rezervimeve',
        badge: 'Sistemi Pro',
        viewMap: 'Harta e Sallës',
        viewList: 'Lista e Orarit',
        guestsLabel: 'Persona:',
        zoneAll: 'Të Gjitha',
        statusAvailable: 'E Lirë',
        statusReserved: 'Rezervuar',
        statusOccupied: 'E Zënë',
        seatSingular: 'Vend',
        seatPlural: 'Vende',
        zoneBooth: 'LOZHAT',
        zoneMain: 'SALLA KRYESORE',
        zoneVIP: 'ZONA VIP',
        zoneTerrace: 'TARRACË',
        table: 'Tavolina',
        capacity: 'Kapaciteti:',
        time: 'Ora:',
        bookModalTitle: 'Rezervo Tavolinën',
        fullName: 'Emri i Plotë i Klientit',
        fullNamePlaceholder: 'p.sh. Alban Berisha',
        phone: 'Numri i Telefonit',
        phonePlaceholder: '+355 / +383...',
        notes: 'Kërkesa të Veçanta (Opsionale)',
        notesPlaceholder: 'Ditëlindje, përvjetor, alergji...',
        cancel: 'Anulo',
        confirm: 'Konfirmo Rezervimin',
        confirmedTitle: 'Rezervimi u Konfirmua!',
        confirmedDesc: (num, time) => `Tavolina #${num} u bllokua me sukses për orën ${time}.`
      },
      en: {
        appTitle: 'TAVOLINA',
        appSubtitle: 'Table & Reservation Management',
        badge: 'Pro System',
        viewMap: 'Floor Plan',
        viewList: 'Time Slots',
        guestsLabel: 'Guests:',
        zoneAll: 'All Areas',
        statusAvailable: 'Available',
        statusReserved: 'Reserved',
        statusOccupied: 'Occupied',
        seatSingular: 'Seat',
        seatPlural: 'Seats',
        zoneBooth: 'BOOTHS',
        zoneMain: 'MAIN DINING',
        zoneVIP: 'VIP AREA',
        zoneTerrace: 'TERRACE',
        table: 'Table',
        capacity: 'Capacity:',
        time: 'Time:',
        bookModalTitle: 'Book Table',
        fullName: 'Guest Full Name',
        fullNamePlaceholder: 'e.g. John Doe',
        phone: 'Phone Number',
        phonePlaceholder: '+1 555-0199...',
        notes: 'Special Requests (Optional)',
        notesPlaceholder: 'Birthday, anniversary, allergies...',
        cancel: 'Cancel',
        confirm: 'Confirm Reservation',
        confirmedTitle: 'Reservation Confirmed!',
        confirmedDesc: (num, time) => `Table #${num} has been booked for ${time}.`
      }
    };

    const INITIAL_TABLES = [
      { id: 'T-01', number: 1, type: 'round', seats: 2, x: 120, y: 110, r: 42, zoneKey: 'zoneMain', status: 'available' },
      { id: 'T-02', number: 2, type: 'round', seats: 4, x: 260, y: 110, r: 52, zoneKey: 'zoneMain', status: 'available' },
      { id: 'T-03', number: 3, type: 'round', seats: 4, x: 400, y: 110, r: 52, zoneKey: 'zoneMain', status: 'reserved' },
      { id: 'T-04', number: 4, type: 'rect', seats: 6, x: 530, y: 80, w: 120, h: 70, zoneKey: 'zoneMain', status: 'available' },
      { id: 'T-05', number: 5, type: 'booth', seats: 6, x: 80, y: 240, w: 110, h: 80, zoneKey: 'zoneBooth', status: 'occupied' },
      { id: 'T-06', number: 6, type: 'booth', seats: 6, x: 80, y: 360, w: 110, h: 80, zoneKey: 'zoneBooth', status: 'available' },
      { id: 'T-07', number: 7, type: 'square', seats: 2, x: 280, y: 250, size: 68, zoneKey: 'zoneMain', status: 'available' },
      { id: 'T-08', number: 8, type: 'square', seats: 2, x: 400, y: 250, size: 68, zoneKey: 'zoneMain', status: 'available' },
      { id: 'T-09', number: 9, type: 'square', seats: 4, x: 280, y: 370, size: 84, zoneKey: 'zoneMain', status: 'available' },
      { id: 'T-10', number: 10, type: 'square', seats: 4, x: 400, y: 370, size: 84, zoneKey: 'zoneMain', status: 'reserved' },
      { id: 'T-11', number: 11, type: 'rect', seats: 8, x: 540, y: 260, w: 130, h: 90, zoneKey: 'zoneVIP', status: 'available' },
      { id: 'T-12', number: 12, type: 'round', seats: 6, x: 600, y: 420, r: 60, zoneKey: 'zoneVIP', status: 'available' },
      { id: 'T-13', number: 13, type: 'high_top', seats: 2, x: 740, y: 110, r: 34, zoneKey: 'zoneTerrace', status: 'available' },
      { id: 'T-14', number: 14, type: 'high_top', seats: 2, x: 740, y: 220, r: 34, zoneKey: 'zoneTerrace', status: 'available' },
      { id: 'T-15', number: 15, type: 'high_top', seats: 2, x: 740, y: 330, r: 34, zoneKey: 'zoneTerrace', status: 'available' },
      { id: 'T-16', number: 16, type: 'high_top', seats: 4, x: 740, y: 440, r: 44, zoneKey: 'zoneTerrace', status: 'occupied' }
    ];

    const SLOTS = ['17:00', '17:30', '18:00', '18:30', '19:00', '19:30', '20:00', '20:30', '21:00'];

    function App() {
      const [lang, setLang] = useState(() => localStorage.getItem('tavolina_lang') || 'sq');
      const [tables, setTables] = useState(() => {
        const saved = localStorage.getItem('tavolina_tables');
        return saved ? JSON.parse(saved) : INITIAL_TABLES;
      });
      const [selectedZone, setSelectedZone] = useState('ALL');
      const [guests, setGuests] = useState(2);
      const [selectedTime, setSelectedTime] = useState('19:30');
      const [activeTable, setActiveTable] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isSuccess, setIsSuccess] = useState(false);
      const [viewMode, setViewMode] = useState('map');

      const [clientName, setClientName] = useState('');
      const [clientPhone, setClientPhone] = useState('');
      const [clientNotes, setClientNotes] = useState('');

      const t = DICTIONARY[lang];

      useEffect(() => {
        localStorage.setItem('tavolina_lang', lang);
      }, [lang]);

      useEffect(() => {
        localStorage.setItem('tavolina_tables', JSON.stringify(tables));
      }, [tables]);

      const zonesList = useMemo(() => [
        { key: 'ALL', label: t.zoneAll },
        { key: 'zoneMain', label: t.zoneMain },
        { key: 'zoneBooth', label: t.zoneBooth },
        { key: 'zoneVIP', label: t.zoneVIP },
        { key: 'zoneTerrace', label: t.zoneTerrace }
      ], [t]);

      const filteredTables = useMemo(() => {
        if (selectedZone === 'ALL') return tables;
        return tables.filter(item => item.zoneKey === selectedZone);
      }, [tables, selectedZone]);

      const handleTableClick = (tableItem) => {
        if (tableItem.status === 'occupied') return;
        setActiveTable(tableItem);
        setIsModalOpen(true);
      };

      const confirmReservation = (e) => {
        e.preventDefault();
        setTables(prev => prev.map(item => 
          item.id === activeTable.id ? { ...item, status: 'reserved' } : item
        ));
        setIsSuccess(true);
        setTimeout(() => {
          setIsSuccess(false);
          setIsModalOpen(false);
          setActiveTable(null);
          setClientName('');
          setClientPhone('');
          setClientNotes('');
        }, 1500);
      };

      const resetTables = () => {
        setTables(INITIAL_TABLES);
        localStorage.removeItem('tavolina_tables');
      };

      return (
        <div className="flex flex-col h-full w-full">
          {/* Header */}
          <header className="h-16 px-6 bg-[#0f172a] border-b border-slate-800 flex items-center justify-between flex-shrink-0">
            <div className="flex items-center space-x-3">
              <div className="h-10 w-10 rounded-xl bg-gradient-to-tr from-rose-500 to-amber-500 flex items-center justify-center shadow-lg shadow-rose-500/20 font-black text-xl text-white">
                T
              </div>
              <div>
                <h1 className="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                  {t.appTitle} <span className="text-[10px] bg-rose-500/20 text-rose-400 font-semibold px-2 py-0.5 rounded border border-rose-500/30 uppercase">{t.badge}</span>
                </h1>
                <p className="text-xs text-slate-400">{t.appSubtitle}</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              {/* Language Switcher */}
              <div className="flex items-center bg-slate-900 border border-slate-800 p-0.5 rounded-lg">
                <button
                  onClick={() => setLang('sq')}
                  className={`px-2.5 py-1 text-xs font-semibold rounded transition-all ${
                    lang === 'sq' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  SQ
                </button>
                <button
                  onClick={() => setLang('en')}
                  className={`px-2.5 py-1 text-xs font-semibold rounded transition-all ${
                    lang === 'en' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  EN
                </button>
              </div>

              {/* View Toggle */}
              <div className="flex items-center bg-slate-900 border border-slate-800 p-1 rounded-xl">
                <button 
                  onClick={() => setViewMode('map')}
                  className={`px-4 py-1.5 rounded-lg text-xs font-semibold transition-all ${viewMode === 'map' ? 'bg-rose-600 text-white shadow-md shadow-rose-600/30' : 'text-slate-400 hover:text-white'}`}>
                  {t.viewMap}
                </button>
                <button 
                  onClick={() => setViewMode('list')}
                  className={`px-4 py-1.5 rounded-lg text-xs font-semibold transition-all ${viewMode === 'list' ? 'bg-rose-600 text-white shadow-md shadow-rose-600/30' : 'text-slate-400 hover:text-white'}`}>
                  {t.viewList}
                </button>
              </div>
            </div>
          </header>

          {/* Filter Bar */}
          <section className="bg-[#111827] border-b border-slate-800/80 px-6 py-3 flex flex-wrap items-center justify-between gap-4 flex-shrink-0">
            <div className="flex items-center gap-2">
              <span className="text-xs font-medium text-slate-400">{t.guestsLabel}</span>
              <div className="flex items-center gap-1 bg-slate-900/90 p-1 rounded-lg border border-slate-800">
                {[1, 2, 4, 6, 8].map(num => (
                  <button 
                    key={num}
                    onClick={() => setGuests(num)}
                    className={`w-8 h-7 text-xs font-semibold rounded ${guests === num ? 'bg-amber-500 text-slate-950 font-bold' : 'text-slate-300 hover:bg-slate-800'}`}>
                    {num}
                  </button>
                ))}
              </div>
            </div>

            <div className="flex items-center gap-2 overflow-x-auto max-w-xl custom-scroll py-1">
              {SLOTS.map(timeStr => (
                <button
                  key={timeStr}
                  onClick={() => setSelectedTime(timeStr)}
                  className={`px-3 py-1.5 text-xs font-medium rounded-lg border transition-all whitespace-nowrap ${
                    selectedTime === timeStr
                      ? 'bg-rose-500/20 text-rose-400 border-rose-500 font-bold'
                      : 'border-slate-800 bg-slate-900/60 text-slate-400 hover:border-slate-700'
                  }`}>
                  {timeStr}
                </button>
              ))}
            </div>

            <div className="flex items-center gap-2">
              {zonesList.map(z => (
                <button
                  key={z.key}
                  onClick={() => setSelectedZone(z.key)}
                  className={`px-3 py-1 rounded-md text-xs font-medium transition-all ${
                    selectedZone === z.key ? 'bg-slate-700 text-white font-semibold' : 'text-slate-400 hover:text-slate-200'
                  }`}>
                  {z.label}
                </button>
              ))}
              <button 
                onClick={resetTables}
                title="Reset layout state"
                className="ml-2 text-slate-500 hover:text-slate-300 text-xs px-2 py-1 border border-slate-800 rounded">
                ↺
              </button>
            </div>
          </section>

          {/* Map / Floor Plan Scaled Container */}
          <main className="flex-1 relative w-full h-full p-4 overflow-hidden flex items-center justify-center">
            {viewMode === 'map' ? (
              <div className="w-full h-full max-h-[82vh] bg-slate-950/60 border border-slate-800/80 rounded-2xl p-2 relative shadow-2xl flex items-center justify-center">
                <div className="absolute top-4 left-4 z-10 flex gap-4 text-[11px] bg-slate-900/90 backdrop-blur px-3 py-1.5 rounded-lg border border-slate-800 shadow">
                  <div className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                    <span className="text-slate-300">{t.statusAvailable}</span>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                    <span className="text-slate-300">{t.statusReserved}</span>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-rose-600"></span>
                    <span className="text-slate-300">{t.statusOccupied}</span>
                  </div>
                </div>

                <svg viewBox="0 0 840 540" className="w-full h-full max-h-full object-contain select-none">
                  <defs>
                    <radialGradient id="grad-avail" cx="50%" cy="50%" r="50%">
                      <stop offset="0%" stopColor="#10b981" stopOpacity="0.25" />
                      <stop offset="100%" stopColor="#047857" stopOpacity="0.45" />
                    </radialGradient>
                    <radialGradient id="grad-res" cx="50%" cy="50%" r="50%">
                      <stop offset="0%" stopColor="#f59e0b" stopOpacity="0.2" />
                      <stop offset="100%" stopColor="#b45309" stopOpacity="0.35" />
                    </radialGradient>
                    <radialGradient id="grad-occ" cx="50%" cy="50%" r="50%">
                      <stop offset="0%" stopColor="#f43f5e" stopOpacity="0.2" />
                      <stop offset="100%" stopColor="#9f1239" stopOpacity="0.35" />
                    </radialGradient>
                  </defs>

                  <rect x="20" y="20" width="800" height="500" rx="16" fill="#0d1424" stroke="#1e293b" strokeWidth="2" strokeDasharray="6 6" />

                  <text x="50" y="55" fill="#475569" fontSize="13" fontWeight="700" letterSpacing="1.5">{t.zoneBooth}</text>
                  <text x="320" y="55" fill="#475569" fontSize="13" fontWeight="700" letterSpacing="1.5">{t.zoneMain}</text>
                  <text x="560" y="55" fill="#475569" fontSize="13" fontWeight="700" letterSpacing="1.5">{t.zoneVIP}</text>
                  <text x="730" y="55" fill="#475569" fontSize="13" fontWeight="700" letterSpacing="1.5">{t.zoneTerrace}</text>

                  <line x1="220" y1="30" x2="220" y2="510" stroke="#1e293b" strokeWidth="1" strokeDasharray="4 4" />
                  <line x1="500" y1="30" x2="500" y2="510" stroke="#1e293b" strokeWidth="1" strokeDasharray="4 4" />
                  <line x1="700" y1="30" x2="700" y2="510" stroke="#1e293b" strokeWidth="1" strokeDasharray="4 4" />

                  {filteredTables.map(item => {
                    const isSuitable = item.seats >= guests;
                    const isAvail = item.status === 'available';
                    const strokeColor = item.status === 'available'
                      ? (isSuitable ? '#10b981' : '#475569')
                      : item.status === 'reserved' ? '#f59e0b' : '#e11d48';

                    const fillGrad = item.status === 'available'
                      ? 'url(#grad-avail)'
                      : item.status === 'reserved' ? 'url(#grad-res)' : 'url(#grad-occ)';

                    return (
                      <g
                        key={item.id}
                        onClick={() => handleTableClick(item)}
                        className={`transition-all duration-300 ${isAvail ? 'cursor-pointer hover:opacity-90' : 'cursor-not-allowed opacity-60'}`}
                      >
                        {(item.type === 'round' || item.type === 'high_top') && (
                          <circle
                            cx={item.x}
                            cy={item.y}
                            r={item.r}
                            fill={fillGrad}
                            stroke={strokeColor}
                            strokeWidth={isSuitable ? "2.5" : "1.5"}
                            strokeDasharray={item.type === 'high_top' ? '4 3' : 'none'}
                          />
                        )}

                        {item.type === 'square' && (
                          <rect
                            x={item.x - item.size / 2}
                            y={item.y - item.size / 2}
                            width={item.size}
                            height={item.size}
                            rx="10"
                            fill={fillGrad}
                            stroke={strokeColor}
                            strokeWidth={isSuitable ? "2.5" : "1.5"}
                          />
                        )}

                        {item.type === 'rect' && (
                          <rect
                            x={item.x - item.w / 2}
                            y={item.y - item.h / 2}
                            width={item.w}
                            height={item.h}
                            rx="12"
                            fill={fillGrad}
                            stroke={strokeColor}
                            strokeWidth={isSuitable ? "2.5" : "1.5"}
                          />
                        )}

                        {item.type === 'booth' && (
                          <g>
                            <rect
                              x={item.x - item.w / 2}
                              y={item.y - item.h / 2}
                              width={item.w}
                              height={item.h}
                              rx="10"
                              fill={fillGrad}
                              stroke={strokeColor}
                              strokeWidth={isSuitable ? "2.5" : "1.5"}
                            />
                            <path
                              d={`M ${item.x - item.w / 2 - 6} ${item.y - item.h / 2} Q ${item.x - item.w / 2 - 10} ${item.y} ${item.x - item.w / 2 - 6} ${item.y + item.h / 2}`}
                              stroke={strokeColor}
                              strokeWidth="5"
                              strokeLinecap="round"
                              fill="none"
                            />
                          </g>
                        )}

                        <text
                          x={item.x}
                          y={item.y - 2}
                          textAnchor="middle"
                          dominantBaseline="middle"
                          fill="#ffffff"
                          fontSize="14"
                          fontWeight="800"
                        >
                          T-{item.number}
                        </text>
                        <text
                          x={item.x}
                          y={item.y + 14}
                          textAnchor="middle"
                          dominantBaseline="middle"
                          fill="#94a3b8"
                          fontSize="10"
                          fontWeight="600"
                        >
                          {item.seats} {item.seats > 1 ? t.seatPlural : t.seatSingular}
                        </text>
                      </g>
                    );
                  })}
                </svg>
              </div>
            ) : (
              <div className="w-full h-full max-h-[82vh] overflow-y-auto custom-scroll grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 p-2">
                {filteredTables.map(tbl => (
                  <div
                    key={tbl.id}
                    onClick={() => handleTableClick(tbl)}
                    className={`p-4 rounded-xl border flex flex-col justify-between transition-all ${
                      tbl.status === 'available'
                        ? 'bg-slate-900 border-slate-700/80 hover:border-rose-500 cursor-pointer shadow-lg'
                        : 'bg-slate-950 border-slate-800 opacity-60 cursor-not-allowed'
                    }`}
                  >
                    <div className="flex items-center justify-between mb-3">
                      <div className="flex items-center gap-2">
                        <span className="w-7 h-7 bg-slate-800 text-rose-400 font-bold rounded-lg flex items-center justify-center text-xs">
                          {tbl.number}
                        </span>
                        <div>
                          <h4 className="text-sm font-bold text-white">{t.table} {tbl.number}</h4>
                          <span className="text-[11px] text-slate-400">{t[tbl.zoneKey]} • {tbl.type.toUpperCase()}</span>
                        </div>
                      </div>
                      <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                        tbl.status === 'available' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 
                        tbl.status === 'reserved' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-rose-500/20 text-rose-400'
                      }`}>
                        {tbl.status === 'available' ? t.statusAvailable : tbl.status === 'reserved' ? t.statusReserved : t.statusOccupied}
                      </span>
                    </div>
                    <div className="flex items-center justify-between text-xs text-slate-400 pt-2 border-t border-slate-800/80">
                      <span>{t.capacity} <strong className="text-slate-200">{tbl.seats} {tbl.seats > 1 ? t.seatPlural : t.seatSingular}</strong></span>
                      <span className="text-rose-400 font-medium">{t.time} {selectedTime}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* Modal */}
          {isModalOpen && activeTable && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0f172a] border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
                {isSuccess ? (
                  <div className="text-center py-8">
                    <div className="w-14 h-14 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-emerald-500/40 text-2xl font-bold">
                      ✓
                    </div>
                    <h3 className="text-xl font-bold text-white mb-1">{t.confirmedTitle}</h3>
                    <p className="text-xs text-slate-400">{t.confirmedDesc(activeTable.number, selectedTime)}</p>
                  </div>
                ) : (
                  <>
                    <div className="flex items-center justify-between pb-3 border-b border-slate-800 mb-4">
                      <div>
                        <h3 className="text-base font-bold text-white">{t.bookModalTitle} #{activeTable.number}</h3>
                        <p className="text-xs text-slate-400">{t[activeTable.zoneKey]} • {activeTable.seats} {activeTable.seats > 1 ? t.seatPlural : t.seatSingular} • {selectedTime}</p>
                      </div>
                      <button 
                        onClick={() => setIsModalOpen(false)}
                        className="text-slate-400 hover:text-white text-lg font-bold p-1">
                        ✕
                      </button>
                    </div>

                    <form onSubmit={confirmReservation} className="space-y-3.5">
                      <div>
                        <label className="text-[11px] font-semibold text-slate-300 block mb-1">{t.fullName}</label>
                        <input 
                          type="text" 
                          required
                          value={clientName}
                          onChange={e => setClientName(e.target.value)}
                          placeholder={t.fullNamePlaceholder}
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-rose-500"
                        />
                      </div>
                      <div>
                        <label className="text-[11px] font-semibold text-slate-300 block mb-1">{t.phone}</label>
                        <input 
                          type="tel" 
                          required
                          value={clientPhone}
                          onChange={e => setClientPhone(e.target.value)}
                          placeholder={t.phonePlaceholder}
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-rose-500"
                        />
                      </div>
                      <div>
                        <label className="text-[11px] font-semibold text-slate-300 block mb-1">{t.notes}</label>
                        <textarea 
                          rows="2"
                          value={clientNotes}
                          onChange={e => setClientNotes(e.target.value)}
                          placeholder={t.notesPlaceholder}
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-rose-500 resize-none"
                        ></textarea>
                      </div>

                      <div className="pt-2 flex items-center gap-3">
                        <button
                          type="button"
                          onClick={() => setIsModalOpen(false)}
                          className="w-1/3 py-2 rounded-lg bg-slate-800 text-slate-300 font-semibold text-xs hover:bg-slate-700 transition-all">
                          {t.cancel}
                        </button>
                        <button
                          type="submit"
                          className="w-2/3 py-2 rounded-lg bg-gradient-to-r from-rose-600 to-amber-600 text-white font-bold text-xs shadow-lg shadow-rose-600/30 hover:opacity-95 transition-all">
                          {t.confirm}
                        </button>
                      </div>
                    </form>
                  </>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
